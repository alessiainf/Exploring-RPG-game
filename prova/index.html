<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My first three.js app</title>
    <style>
      body { margin: 0; }

      #interactionPrompt {
        position: absolute;
        bottom: 10%;
        width: 100%;
        text-align: center;
        font-size: 40px;
        color: white;
        text-shadow: 1px 1px 2px black;
        font-family: sans-serif;
        display: none;
        pointer-events: none;
        z-index: 10;
      }

      .dialogue-button {
        background-color: #bb4c51;  /* verde brillante */
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 30px;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: transform 0.2s, background-color 0.3s;
      }

      .dialogue-button:hover {
        background-color: #45a049;
        transform: scale(1.05);
      }

      .dialogue-button:active {
        transform: scale(0.95);
      }

    </style>
  </head>
  <body>
    <!-- Messaggio interazione -->
    <div id="interactionPrompt">Premi F</div>
<div id="dialogueBox" style="
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  padding: 20px 28px;
  background: linear-gradient(to right, rgba(20, 20, 20, 0.95), rgba(40, 40, 40, 0.95));
  color: #ffecc7;
  font-family: 'Georgia', serif;
  font-size: 32px;
  font-weight: bold;
  border: 2px solid #fff;
  border-radius: 16px;
  box-shadow: 0 0 15px #ffffffaa;
  max-width: 90%;
  text-align: center;
  display: none;
  z-index: 10;
  white-space: pre-line;
  line-height: 1.4;
">
  <p id="riddleQuestion" style="margin-bottom: 20px;"></p>
  <div id="riddleOptions"></div>
</div>







    <!-- Script principale -->
    <script type="module" src="/main.js"></script>
  </body>
</html>
